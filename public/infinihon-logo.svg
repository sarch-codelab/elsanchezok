<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" role="img" aria-labelledby="title">
  <title id="title">Infinihon — Infraestructura que mueve el futuro</title>
  <!-- Logotipo tipográfico fiel a infinihon.vercel.app: sans geométrico, tracking apretado, HN como marca de origen -->
  <rect width="420" height="90" rx="12" fill="#0a0a0a"/>
  <!-- Wordmark Infinihon pegado -->
  <text x="22" y="52" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.04em" fill="#f1efea">infinihon</text>
  <!-- Submark Technology & Infrastructure -->
  <text x="22" y="71" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.2" letter-spacing="0.22em" fill="#b9a6e8">TECHNOLOGY &amp; INFRASTRUCTURE — HN 14.0818° N</text>
  <!-- Marca HN -->
  <g opacity="0.95">
    <rect x="332" y="16" width="64" height="28" rx="6" fill="none" stroke="#b9a6e8" stroke-width="1.1"/>
    <text x="364" y="34.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#f1efea">HN</text>
  </g>
</svg>
